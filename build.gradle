plugins {
    id 'java'
    id 'war'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
}

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.platform:jakarta.jakartaee-api:11.0.0')
    implementation('org.glassfish.jersey.containers:jersey-container-servlet:4.0.2')
    implementation('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.2')
    implementation('org.glassfish.jersey.inject:jersey-cdi2-se:4.0.2')
    implementation('org.glassfish.jersey.core:jersey-client:4.0.2')
    implementation('org.eclipse.persistence:org.eclipse.persistence.jpa:5.0.1')
    implementation('org.hibernate.orm:hibernate-core:7.4.5.Final')
    implementation('org.glassfish.jaxb:jaxb-runtime:4.0.9')
    implementation('org.hibernate.validator:hibernate-validator:9.1.3.Final')
    implementation('org.glassfish:jakarta.faces:4.1.13')
    implementation('org.glassfish.tyrus:tyrus-container-grizzly-server:2.2.2')
    implementation('org.glassfish.tyrus.bundles:tyrus-standalone-client:2.2.2')
    implementation('org.jboss.weld.se:weld-se-core:6.0.4.Final')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}